name: build

# Build only. Every test boots Rhino through Rhino.Inside, and a hosted runner
# has neither Rhino nor a licence for one, so `dotnet test` here would fail for
# reasons unrelated to the change. Run tests locally; CI guards compilation.
#
# The sibling repos are checked out so the project references resolve. Once
# the dependency is published on nuget.org, these extra checkouts can go and the
# build will fall through to the pinned packages instead.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          path: StructuralForm

      # A missing secret is not an error in Actions - it interpolates to an
      # empty string, checkout then authenticates as nobody, and GitHub answers
      # 404 for a private repo it will not admit exists. That is indis-
      # tinguishable from the repo being genuinely absent, so check it here and
      # say which it is. Delete this step once the secret is settled.
      - name: Check the cross-repo token is visible
        env:
          TOKEN: ${{ secrets.OTTERLOGIC_REPOS_TOKEN }}
        run: |
          if ([string]::IsNullOrEmpty($env:TOKEN)) {
            Write-Host "::error::OTTERLOGIC_REPOS_TOKEN is empty or not visible to this repository. Create it, and if it is an organisation secret check its repository access list. A fine-grained PAT also needs Contents: Read on the other OtterLogic repos, the organisation must permit fine-grained PATs, and the token may be sitting unapproved in the org's pending list."
            exit 1
          }
          Write-Host "Token is visible to this workflow."

      # An explicit token: the default GITHUB_TOKEN only covers the repository
      # running the workflow, so checking out another private repo in the org
      # fails as "Not Found" - GitHub will not confirm that a repo you cannot
      # read exists. Needs Contents: Read on Otter-Logic/Core.
      - uses: actions/checkout@v4
        with:
          repository: Otter-Logic/Core
          path: Core
          token: ${{ secrets.OTTERLOGIC_REPOS_TOKEN }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build StructuralForm/OtterLogic.slnx -c Release
